  <title id="title">One pulse train, two distinct event words</title>
  <desc id="desc">Direct deterministic output of the checked-in public-development pulse constructor for one protected skipping cell. PS-NFL-H4 has a support-qualified period-two event word 01 repeated ten times; PS-IFFL-H4 is period one and has no skipping signature. Both topology dispositions remain unresolved because no actionable estimator, rival certificate, comparison, confirmation partition, workstation performance measurement, or energy measurement exists.</desc>
