name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # Praetor engine commit the local hooks and `make verify-all` run. Read by
  # .config/lefthook/engine.sh on the workstation; no job in this workflow uses it.
  PRAETOR_REF: 18c50fc7476aeb92011a409bc6b71351a9ded3cf

jobs:
  impact-plan:
    name: CI impact plan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      container: ${{ steps.plan.outputs.container }}
      dependency: ${{ steps.plan.outputs.dependency }}
      go: ${{ steps.plan.outputs.go }}
      release: ${{ steps.plan.outputs.release }}
      renderer: ${{ steps.plan.outputs.renderer }}
      renderer_proof: ${{ steps.plan.outputs.renderer_proof }}
      research: ${{ steps.plan.outputs.research }}
      site: ${{ steps.plan.outputs.site }}
      workstation_any: ${{ steps.plan.outputs.workstation_any }}
      workstation_matrix: ${{ steps.plan.outputs.workstation_matrix }}
    steps:
      - name: Check out the complete comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Validate and project the bounded CI plan
        id: plan
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "amd64"
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: "local"
          GOFLAGS: "-mod=readonly"
          GOPROXY: "off"
          GOSUMDB: "off"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            go -C tooling run ./cmd/ci-plan plan --root .. \
              --base "$BASE_SHA" --head "$HEAD_SHA" --json \
              > build/ci-impact-plan.json
          elif [[ "$EVENT_NAME" == "push" ]]; then
            zero_sha=0000000000000000000000000000000000000000
            valid_commit() {
              local sha="$1"
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${sha}^{commit}" 2>/dev/null
            }
            if [[ "$BEFORE_SHA" != "$zero_sha" ]] \
              && valid_commit "$BEFORE_SHA" \
              && valid_commit "$CURRENT_SHA" \
              && git merge-base --is-ancestor "$BEFORE_SHA" "$CURRENT_SHA"; then
              go -C tooling run ./cmd/ci-plan plan --root .. \
                --base "$BEFORE_SHA" --head "$CURRENT_SHA" --json \
                > build/ci-impact-plan.json
            else
              echo "::notice::Main-push comparison is unavailable; running the fail-closed full plan."
              go -C tooling run ./cmd/ci-plan plan --root .. --full --json \
                > build/ci-impact-plan.json
            fi
          else
            go -C tooling run ./cmd/ci-plan plan --root .. --full --json \
              > build/ci-impact-plan.json
          fi
          test -s build/ci-impact-plan.json
          go -C tooling run ./cmd/ci-plan project \
            < build/ci-impact-plan.json >> "$GITHUB_OUTPUT"
      - name: Refuse tool attribution in new commit messages
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "amd64"
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: "local"
          GOFLAGS: "-mod=readonly"
          GOPROXY: "off"
          GOSUMDB: "off"
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # The test merge commit has the base tip and the pull-request head as its parents.
            base_tip="$(git rev-parse --verify "${CURRENT_SHA}^1^{commit}")"
            merged_head="$(git rev-parse --verify "${CURRENT_SHA}^2^{commit}")"
            if [[ "$merged_head" != "$HEAD_SHA" ]]; then
              echo "::error::The checked-out merge commit does not merge the pull-request head."
              exit 1
            fi
            go -C tooling run ./cmd/ci-plan messages --root .. \
              --base "$base_tip" --head "$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "$zero_sha" ]] \
            && git merge-base --is-ancestor "$BEFORE_SHA" "$CURRENT_SHA"; then
            go -C tooling run ./cmd/ci-plan messages --root .. \
              --base "$BEFORE_SHA" --head "$CURRENT_SHA"
          else
            echo "::notice::No comparison range for this event; checking the tip commit message only."
            go -C tooling run ./cmd/ci-plan messages --root .. --head "$CURRENT_SHA"
          fi

  quality-full:
    name: Full quality
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high --package-lock-only --fetch-timeout=30000 --fetch-retries=1
      - name: Reject a code-shape baseline reset
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BASE_SHA="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
          fi
          node scripts/audit-code-shape.mjs --base-revision "$BASE_SHA"

  impact-common:
    name: Impact common
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || needs.impact-plan.outputs.mode == 'impact'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Run common impact checks
        run: npm run check:impact-common

  lane-go:
    name: Go lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || (needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.go == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Fetch the locked CLRS retained inputs
        run: |
          go -C tooling run ./cmd/20w experiment fetch-clrs-retained-inputs --root .. --output "$RUNNER_TEMP/clrs-retained"
          {
            echo "CLRS_RETAINED_INPUTS_REQUIRED=1"
            echo "CLRS_PROMISE_TEST_INPUTS=$RUNNER_TEMP/clrs-retained"
            echo "CLRS_SOURCE_ARCHIVE_TEST_PATH=$RUNNER_TEMP/clrs-retained/clrs-source.tar.gz"
            echo "CLRS_SBOM_BUNDLE=$RUNNER_TEMP/clrs-retained/sbom-bundle"
          } >> "$GITHUB_ENV"
      - name: Reproduce the locked Promise wheel
        run: |
          docker pull "$(jq -er .source_build.builder_image tooling/clrs-generator/wheelhouse.json)"
          go -C tooling run ./cmd/20w experiment reproduce-clrs-promise-wheel --root .. --inputs "$RUNNER_TEMP/clrs-retained" --output "$RUNNER_TEMP/promise-wheel"
          {
            echo "CLRS_PROMISE_TEST_SOURCE=$RUNNER_TEMP/clrs-retained/source-build-inputs/promise-2.3.tar.gz"
            echo "CLRS_PROMISE_TEST_WHEEL=$RUNNER_TEMP/promise-wheel/run-1/promise-2.3-py3-none-any.whl"
          } >> "$GITHUB_ENV"
      - name: Test and vet Go packages
        run: go -C tooling test -race ./... && go -C tooling vet ./...
      - name: Type-check the Windows and macOS builds
        run: |
          GOOS=windows GOARCH=amd64 go -C tooling vet ./...
          GOOS=darwin GOARCH=arm64 go -C tooling vet ./...
      - name: Fuzz the untrusted JSON boundary
        run: go -C tooling test ./internal/strictjson -run '^$' -fuzz '^FuzzValidate$' -fuzztime=30s -fuzzminimizetime=5s -parallel=2 -timeout=2m
      - name: Build and execute the native release binary
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          source_timestamp="$(git show -s --format=%cI "$revision")"
          go -C tooling run ./cmd/build-release --version v0.0.0 --revision "$revision" --built-at "$source_timestamp" --output-root ../build/native-release
          ./build/native-release/20w-linux-amd64 validate docs --root .
      - name: Scan Go packages for known vulnerabilities
        run: go -C tooling run ./cmd/20w security govulncheck --root ..

  lane-go-windows:
    name: Go lane (Windows)
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || (needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.go == 'true')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Test Go packages
        run: go -C tooling test ./...

  lane-go-macos:
    name: Go lane (macOS)
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || (needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.go == 'true')
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Test Go packages
        run: go -C tooling test ./...

  lane-release:
    name: Release lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || (needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.release == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Run release checks
        run: npm run check:lane-release

  pdf-renderer-reproducibility:
    name: PDF renderer reproducibility
    needs: impact-plan
    if: needs.impact-plan.outputs.renderer == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Set up the locked PDF Docker Buildx client
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Restore the PDF renderer build cache
        id: pdf-renderer-cache
        if: needs.impact-plan.outputs.renderer_proof == 'render-pair'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: build/cache/pdf-renderer
          key: pdf-renderer-buildkit-v1-linux-amd64-${{ hashFiles('tooling/pdf-renderer/lock.json', 'tooling/internal/boundedexec/**', 'tooling/internal/fileidentity/**', 'tooling/internal/pdfrender/**', 'tooling/internal/pdfrenderlock/**', 'tooling/internal/pdfrendercli/**', 'tooling/internal/strictjson/**', 'tooling/cmd/pdf-proof/**', 'tooling/go.mod', 'tooling/go.sum') }}
      - name: Reject a non-exact PDF renderer cache restore
        if: needs.impact-plan.outputs.renderer_proof == 'render-pair'
        timeout-minutes: 1
        env:
          CACHE_MATCHED_KEY: ${{ steps.pdf-renderer-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.pdf-renderer-cache.outputs.cache-hit }}
        run: |-
          if [ -n "$CACHE_MATCHED_KEY" ] && [ "$CACHE_HIT" != "true" ]; then
            echo "::error::PDF renderer cache restore did not match the exact key"
            exit 1
          fi
      - name: Verify the selected PDF reproducibility proof
        id: pdf-renderer-proof
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "amd64"
          GOENV: "off"
          GOWORK: "off"
          GOTOOLCHAIN: "local"
          GOFLAGS: "-mod=readonly"
          GOPROXY: "off"
          GOSUMDB: "off"
          RENDERER_PROOF: ${{ needs.impact-plan.outputs.renderer_proof }}
        run: >-
          go -C tooling run ./cmd/pdf-proof
          --root .. --ref main --proof "$RENDERER_PROOF"
          --cache-dir build/cache/pdf-renderer
          --receipt build/evidence/pdf-renderer-reproducibility.json
      - name: Save the verified PDF renderer build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pdf-renderer-proof.outcome == 'success' && steps.pdf-renderer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: build/cache/pdf-renderer
          key: pdf-renderer-buildkit-v1-linux-amd64-${{ hashFiles('tooling/pdf-renderer/lock.json', 'tooling/internal/boundedexec/**', 'tooling/internal/fileidentity/**', 'tooling/internal/pdfrender/**', 'tooling/internal/pdfrenderlock/**', 'tooling/internal/pdfrendercli/**', 'tooling/internal/strictjson/**', 'tooling/cmd/pdf-proof/**', 'tooling/go.mod', 'tooling/go.sum') }}
      - name: Retain the PDF renderer reproducibility evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pdf-renderer-reproducibility
          path: |-
            build/evidence/pdf-renderer-reproducibility.json
            build/evidence/pdf-renderer-reproducibility-mismatch
          if-no-files-found: error
          retention-days: 30
      - name: Verify the published PDF against the fresh renders
        timeout-minutes: 2
        run: node scripts/validate-published-book-render.mjs --receipt build/evidence/pdf-renderer-reproducibility.json

  lane-research:
    name: Research lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || (needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.research == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Use the locked Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'
      - name: Run research checks
        run: npm run check:lane-research

  lane-site:
    name: Site lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || (needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.site == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Run site checks
        run: npm run check:lane-site

  lane-site-browser:
    name: Site browser lane
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || (needs.impact-plan.outputs.mode == 'impact' && needs.impact-plan.outputs.site == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Run site browser checks
        run: npm run check:lane-site-browser

  workstation-core:
    name: Workstation core
    needs: impact-plan
    if: needs.impact-plan.outputs.workstation_any == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Validate the workstation inventory and core
        run: npm run validate:workstation && npm run test:workstation:core

  workstation-artifacts:
    name: Workstation test (${{ matrix.artifact }})
    needs: impact-plan
    if: needs.impact-plan.outputs.workstation_any == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.impact-plan.outputs.workstation_matrix) }}
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the locked Python runtime for Fixture 019
        if: contains(format(' {0} ', matrix.scripts), ' test:workstation:fixture-019 ')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'
      - name: Install the locked scientific runtime for Fixture 019
        if: contains(format(' {0} ', matrix.scripts), ' test:workstation:fixture-019 ')
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements-ci.txt
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.1
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.1
        run: test "$(npm --version)" = "12.2.1"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Run the allowlisted artifact test script
        env:
          SCRIPTS: ${{ matrix.scripts }}
        run: node scripts/run-workstation-scripts.mjs

  container-smoke:
    name: Container smoke paths
    needs: impact-plan
    if: needs.impact-plan.outputs.mode == 'full' || needs.impact-plan.outputs.container == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive the lowercase registry repository
        run: |
          set -euo pipefail
          image_repository="${GITHUB_REPOSITORY,,}"
          if [[ ! "$image_repository" =~ ^[a-z0-9]([a-z0-9._-]{0,99}[a-z0-9])?/[a-z0-9]([a-z0-9._-]{0,99}[a-z0-9])?$ ]]; then
            echo "::error::repository identity does not lowercase to a bounded OCI owner/name"
            exit 1
          fi
          printf 'IMAGE_REPOSITORY=%s\n' "$image_repository" >> "$GITHUB_ENV"
      - name: Use Go 1.27 for closed image contexts
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build the static 20w image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tooling/Dockerfile
          load: true
          push: false
          tags: 20w-tooling:test
          build-args: |
            IMAGE_VERSION=development
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_TIMESTAMP=unknown
          cache-from: type=gha,scope=20w-tooling-image
          cache-to: type=gha,mode=max,scope=20w-tooling-image
      - name: Verify the static 20w image against the mounted repository
        run: |
          set -euo pipefail
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            20w-tooling:test version --json
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            20w-tooling:test validate docs --root /repo
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            20w-tooling:test experiment list --root /repo --json
      - name: Build the CLRS shakedown specialist image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tooling/clrs-specialist/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          network: none
          tags: 20w-clrs-shakedown:test
          build-args: |
            IMAGE_NAME=ghcr.io/${{ env.IMAGE_REPOSITORY }}-clrs-shakedown
            IMAGE_VERSION=development
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_TIMESTAMP=unknown
          cache-from: type=gha,scope=clrs-shakedown-image
          cache-to: type=gha,mode=max,scope=clrs-shakedown-image
      - name: Execute the bounded CLRS specialist smoke path
        run: |
          set -euo pipefail
          response="$(timeout --signal=TERM --kill-after=2s 15s \
            docker run --rm --interactive --pull never \
            --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 1 --memory 64m --memory-swap 64m --pids-limit 32 --stop-timeout 5 \
            20w-clrs-shakedown:test \
            < tooling/clrs-specialist/smoke-request.json)"
          jq --exit-status --arg revision "$GITHUB_SHA" '
            .schema_version == 1 and
            .authority == "NO_RESULT" and
            .source_id == "sha256:7ec3b6b7528d04f517c4e9b7c3e0cd0f7034a775d225d469d1aca5c00fec10d1" and
            .generation_contract_id == "sha256:cc14fce405e8fa7d4719f1fc906e28d5e4b73235085c8f0722795efded2891a8" and
            .task == "insertion_sort" and
            .specialist_id == "clrs-exact-insertion-sort-v1" and
            .binding == "sha256:1111111111111111111111111111111111111111111111111111111111111111" and
            .timeout_milliseconds == 1000 and .max_result_bytes == 1048576 and
            .state == "completed" and .reason == "ready" and
            .payload == "[0.424 0.545 0.549 0.603 0.715]\n\n" and
            .build.version == "development" and .build.revision == $revision and
            .build.go_version == "go1.27.3" and .build.os == "linux" and
            .build.architecture == "amd64"
          ' <<<"$response" >/dev/null
      - name: Package the closed Fixture 007 runtime context
        run: go -C tooling run ./cmd/20w experiment package-node-image --root .. --artifact fixture-007 --output ../build/container-contexts/fixture-007
      - name: Build the Fixture 007 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/container-contexts/fixture-007
          file: experiments/workstation/Dockerfile.node-artifact
          load: true
          push: false
          tags: 20w-fixture-007:test
          build-args: |
            EXPERIMENT_ARTIFACT=fixture-007
            IMAGE_NAME=ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-007
            IMAGE_VERSION=development
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=fixture-007-image
          cache-to: type=gha,mode=max,scope=fixture-007-image
      - name: Execute the bounded Fixture 007 smoke path
        run: |
          set -euo pipefail
          node_version="$(docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node 20w-fixture-007:test --version)"
          if [[ "$node_version" != "v26.12.0" ]]; then
            echo "::error::Fixture 007 Node.js runtime is $node_version, want v26.12.0"
            exit 1
          fi
          volume="20w-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fixture-007"
          docker volume create "$volume"
          trap 'docker volume rm "$volume" >/dev/null' EXIT
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/results" \
            20w-fixture-007:test smoke --profile smoke --output /workspace/results/ci-fixture-007
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/results" \
            20w-fixture-007:test analyze --output /workspace/results/ci-fixture-007
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/results" \
            20w-fixture-007:test validate --output /workspace/results/ci-fixture-007
      - name: Package the closed Fixture 019 runtime context
        run: go -C tooling run ./cmd/20w experiment package-node-image --root .. --artifact fixture-019 --output ../build/container-contexts/fixture-019
      - name: Build the Fixture 019 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/container-contexts/fixture-019
          file: experiments/workstation/fixture-019/Dockerfile
          load: true
          push: false
          tags: 20w-fixture-019:test
          build-args: |
            IMAGE_NAME=ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-019
            IMAGE_VERSION=development
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=fixture-019-image
          cache-to: type=gha,mode=max,scope=fixture-019-image
      - name: Verify the locked runtimes and smoke profile
        run: |
          set -euo pipefail
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint sh 20w-fixture-019:test -c \
            'test "$(node --version)" = "v26.12.0" && test "$(python --version)" = "Python 3.15.0" && python -c "import numpy; assert numpy.__version__ == \"2.5.4\""'
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            20w-fixture-019:test prepare --profile smoke
      - name: Execute the bounded Fixture 019 smoke path
        run: |
          set -euo pipefail
          volume="20w-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fixture-019"
          docker volume create "$volume"
          trap 'docker volume rm "$volume" >/dev/null' EXIT
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/workspace/results" \
            20w-fixture-019:test smoke --profile smoke --output /workspace/results/ci-fixture-019 --resume false
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/workspace/results" \
            20w-fixture-019:test analyze --output /workspace/results/ci-fixture-019
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/workspace/results" \
            20w-fixture-019:test validate --output /workspace/results/ci-fixture-019
      - name: Install the pinned Trivy scanner
        env:
          TRIVY_VERSION: 0.76.0
          TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          install -d "$RUNNER_TEMP/trivy-bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/trivy-bin" trivy
          printf '%s\n' "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      # The planted root file system carries lodash 4.17.15, which has fixed
      # HIGH advisories; a scan that passes it has no working database. Exit
      # code 7 separates findings from a scanner error, which exits 1.
      - name: Prove Trivy rejects a planted vulnerable package
        run: |
          set -euo pipefail
          planted="$RUNNER_TEMP/trivy-planted"
          install -d "$planted/app/node_modules/lodash"
          printf '{"name":"lodash","version":"4.17.15"}\n' > "$planted/app/node_modules/lodash/package.json"
          status=0
          trivy rootfs --db-repository mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 7 --timeout 10m "$planted" || status=$?
          if [[ "$status" != 7 ]]; then
            echo "::error::Trivy exited $status on a planted lodash 4.17.15, want 7"
            exit 1
          fi
      - name: Scan the built images with Trivy
        run: |
          set -euo pipefail
          for image in 20w-tooling:test 20w-clrs-shakedown:test 20w-fixture-007:test 20w-fixture-019:test; do
            trivy image --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --timeout 10m "$image"
          done

  dependency-review:
    name: Dependency review
    needs: impact-plan
    if: github.event_name == 'pull_request' && (needs.impact-plan.outputs.mode == 'full' || needs.impact-plan.outputs.dependency == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/tools/go.sum
      - name: Prove the pinned gitleaks reports a planted secret
        run: go -C tooling run ./cmd/20w security gitleaks-canary --root ..
      - name: Scan the history reachable from HEAD with gitleaks
        working-directory: tooling/tools
        run: go tool gitleaks git --no-banner --redact --ignore-gitleaks-allow --timeout 300 --exit-code 1 --log-opts=HEAD ../..

  ci-success:
    name: CI success
    if: always()
    needs:
      - impact-plan
      - quality-full
      - impact-common
      - lane-go
      - lane-go-windows
      - lane-go-macos
      - lane-release
      - pdf-renderer-reproducibility
      - lane-research
      - lane-site
      - lane-site-browser
      - workstation-core
      - workstation-artifacts
      - container-smoke
      - dependency-review
      - secret-scan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every expected gate state
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ needs.impact-plan.outputs.mode }}
          SELECT_CONTAINER: ${{ needs.impact-plan.outputs.container }}
          SELECT_DEPENDENCY: ${{ needs.impact-plan.outputs.dependency }}
          SELECT_GO: ${{ needs.impact-plan.outputs.go }}
          SELECT_RELEASE: ${{ needs.impact-plan.outputs.release }}
          SELECT_RENDERER: ${{ needs.impact-plan.outputs.renderer }}
          SELECT_RESEARCH: ${{ needs.impact-plan.outputs.research }}
          SELECT_SITE: ${{ needs.impact-plan.outputs.site }}
          SELECT_WORKSTATION: ${{ needs.impact-plan.outputs.workstation_any }}
          RESULT_PLAN: ${{ needs.impact-plan.result }}
          RESULT_QUALITY_FULL: ${{ needs.quality-full.result }}
          RESULT_IMPACT_COMMON: ${{ needs.impact-common.result }}
          RESULT_GO: ${{ needs.lane-go.result }}
          RESULT_GO_WINDOWS: ${{ needs.lane-go-windows.result }}
          RESULT_GO_MACOS: ${{ needs.lane-go-macos.result }}
          RESULT_RELEASE: ${{ needs.lane-release.result }}
          RESULT_RENDERER: ${{ needs.pdf-renderer-reproducibility.result }}
          RESULT_RESEARCH: ${{ needs.lane-research.result }}
          RESULT_SITE: ${{ needs.lane-site.result }}
          RESULT_SITE_BROWSER: ${{ needs.lane-site-browser.result }}
          RESULT_WORKSTATION_CORE: ${{ needs.workstation-core.result }}
          RESULT_WORKSTATION_ARTIFACTS: ${{ needs.workstation-artifacts.result }}
          RESULT_CONTAINER: ${{ needs.container-smoke.result }}
          RESULT_DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          RESULT_SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail

          require_state() {
            local gate="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$gate state is $actual, want $expected"
              exit 1
            fi
          }

          require_selection() {
            local gate="$1"
            local actual="$2"
            local selected="$3"
            case "$selected" in
              true) require_state "$gate" "$actual" success ;;
              false) require_state "$gate" "$actual" skipped ;;
              *) echo "::error::$gate selector is malformed: $selected"; exit 1 ;;
            esac
          }

          require_state impact-plan "$RESULT_PLAN" success
          require_state secret-scan "$RESULT_SECRET_SCAN" success

          case "$MODE" in
            full)
              for selector in "$SELECT_CONTAINER" "$SELECT_DEPENDENCY" "$SELECT_GO" "$SELECT_RELEASE" \
                "$SELECT_RESEARCH" "$SELECT_SITE"; do
                if [[ "$selector" != "false" ]]; then
                  echo "::error::full plan exposed a non-false semantic selector: $selector"
                  exit 1
                fi
              done
              if [[ "$SELECT_WORKSTATION" != "true" ]]; then
                echo "::error::full plan did not expose its closed workstation matrix"
                exit 1
              fi
              require_state quality-full "$RESULT_QUALITY_FULL" success
              require_state impact-common "$RESULT_IMPACT_COMMON" success
              require_state lane-go "$RESULT_GO" success
              require_state lane-go-windows "$RESULT_GO_WINDOWS" success
              require_state lane-go-macos "$RESULT_GO_MACOS" success
              require_state lane-release "$RESULT_RELEASE" success
              require_selection pdf-renderer-reproducibility "$RESULT_RENDERER" "$SELECT_RENDERER"
              require_state lane-research "$RESULT_RESEARCH" success
              require_state lane-site "$RESULT_SITE" success
              require_state lane-site-browser "$RESULT_SITE_BROWSER" success
              require_state workstation-core "$RESULT_WORKSTATION_CORE" success
              require_state workstation-artifacts "$RESULT_WORKSTATION_ARTIFACTS" success
              require_state container-smoke "$RESULT_CONTAINER" success
              if [[ "$EVENT_NAME" == "pull_request" ]]; then
                require_state dependency-review "$RESULT_DEPENDENCY_REVIEW" success
              else
                require_state dependency-review "$RESULT_DEPENDENCY_REVIEW" skipped
              fi
              ;;
            impact)
              if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "push" ]]; then
                echo "::error::impact mode is allowed only for pull requests and pushes"
                exit 1
              fi
              require_state quality-full "$RESULT_QUALITY_FULL" skipped
              require_state impact-common "$RESULT_IMPACT_COMMON" success
              require_selection lane-go "$RESULT_GO" "$SELECT_GO"
              require_selection lane-go-windows "$RESULT_GO_WINDOWS" "$SELECT_GO"
              require_selection lane-go-macos "$RESULT_GO_MACOS" "$SELECT_GO"
              require_selection lane-release "$RESULT_RELEASE" "$SELECT_RELEASE"
              require_selection pdf-renderer-reproducibility "$RESULT_RENDERER" "$SELECT_RENDERER"
              require_selection lane-research "$RESULT_RESEARCH" "$SELECT_RESEARCH"
              require_selection lane-site "$RESULT_SITE" "$SELECT_SITE"
              require_selection lane-site-browser "$RESULT_SITE_BROWSER" "$SELECT_SITE"
              require_selection workstation-core "$RESULT_WORKSTATION_CORE" "$SELECT_WORKSTATION"
              require_selection workstation-artifacts "$RESULT_WORKSTATION_ARTIFACTS" "$SELECT_WORKSTATION"
              require_selection container-smoke "$RESULT_CONTAINER" "$SELECT_CONTAINER"
              if [[ "$EVENT_NAME" == "pull_request" ]]; then
                require_selection dependency-review "$RESULT_DEPENDENCY_REVIEW" "$SELECT_DEPENDENCY"
              else
                require_state dependency-review "$RESULT_DEPENDENCY_REVIEW" skipped
              fi
              ;;
            *)
              echo "::error::impact plan mode is malformed: $MODE"
              exit 1
              ;;
          esac
