name: PR title

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\([^()]{1,64}\))?(!)?:[[:space:]]+[^[:space:]]'; then
            echo "::error::PR title must use Conventional Commits: <type>(<scope>): <description>"
            exit 1
          fi
