name: Publish GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    env:
      PAGES_BASE_PATH: /
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm 12.2.0
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.2.0
        run: test "$(npm --version)" = "12.2.0"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Verify the closed source-publication allowlist
        run: npm run validate:sources
      - name: Test source-publication tamper resistance
        # This suite is a single file, so the default process-isolated runner
        # has identical test semantics in CI.
        run: node --test scripts/source-boundary.test.mjs
      - name: Test, build, and validate the publication artifact
        run: npm run test:github-pages
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-github-pages
          include-hidden-files: true
          # restore-verified-site redeploys this artifact when a later
          # deployment fails public verification.
          retention-days: 90

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify-public-transport:
    name: Verify Cloudflare public transport
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Verify the public redirect and certificate boundary
        shell: bash
        run: go -C tooling run ./cmd/20w publication verify-public-transport --root .. 2>&1 | tee public-transport-observation.txt
      - name: Retain the bounded public-transport observation
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-transport-observation
          path: public-transport-observation.txt
          if-no-files-found: error
          retention-days: 30

  restore-verified-site:
    name: Restore the last verified site
    # A deployment that fails public verification is replaced with the
    # artifact of the last run whose verification passed.
    needs: [deploy, verify-public-transport]
    if: ${{ always() && needs.deploy.result == 'success' && needs.verify-public-transport.result == 'failure' }}
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.restore.outputs.page_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Find the last verified run
        id: verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          run=$(gh api "repos/$REPOSITORY/actions/workflows/github-pages.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"')
          if [ -z "$run" ]; then
            echo "::error::No verified Pages run exists; the failed deployment stays live."
            exit 1
          fi
          read -r run_id head_sha <<< "$run"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Restoring the site of run $run_id (commit $head_sha)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Download the verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          run-id: ${{ steps.verified.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified
      - name: Stage the verified artifact for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-pages-verified
          path: ${{ runner.temp }}/verified/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - name: Deploy the verified site
        id: restore
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-verified
