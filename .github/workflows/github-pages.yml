name: Publish GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    env:
      PAGES_BASE_PATH: /
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Verify the closed source-publication allowlist
        run: npm run validate:sources
      - name: Test source-publication tamper resistance
        # This suite is a single file, so the default process-isolated runner
        # has identical test semantics in CI.
        run: node --test scripts/source-boundary.test.mjs
      - name: Test, build, and validate the publication artifact
        run: npm run test:github-pages
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-github-pages
          include-hidden-files: true

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify-public-transport:
    name: Verify Cloudflare public transport
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Verify the public redirect and certificate boundary
        shell: bash
        run: go -C tooling run ./cmd/20w publication verify-public-transport --root .. 2>&1 | tee public-transport-observation.txt
      - name: Retain the bounded public-transport observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-transport-observation
          path: public-transport-observation.txt
          if-no-files-found: error
          retention-days: 30
