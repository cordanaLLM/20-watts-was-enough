name: Research release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to rebuild
        required: true
        type: string

permissions: {}

concurrency:
  group: research-release-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source and prepare assets
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.release-ref.outputs.tag }}
      release-commit: ${{ steps.release-ref.outputs.commit }}
      release-timestamp: ${{ steps.release-ref.outputs.timestamp }}
      release-epoch: ${{ steps.release-ref.outputs.epoch }}
    steps:
      - name: Resolve the requested release tag
        id: requested-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must have the exact form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.requested-tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Prove HEAD is the requested existing tag
        id: release-ref
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.requested-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "::error::the requested release tag does not exist"
            exit 1
          fi
          release_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$release_commit" ]]; then
            echo "::error::checkout HEAD does not match the requested release tag"
            exit 1
          fi
          event_commit="$(git rev-parse "${EVENT_SHA}^{commit}")"
          if [[ "$EVENT_REF" != "refs/tags/${RELEASE_TAG}" || "$event_commit" != "$release_commit" ]]; then
            echo "::error::release runs, including manual rebuilds, must be dispatched at the exact existing tag ref"
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::origin/main is unavailable; release ancestry cannot be verified"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "::error::the tagged commit is not contained in origin/main"
            exit 1
          fi
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'commit=%s\n' "$release_commit"
            printf 'timestamp=%s\n' "$(git show -s --format=%cI "$release_commit")"
            printf 'epoch=%s\n' "$(git show -s --format=%ct "$release_commit")"
          } >> "$GITHUB_OUTPUT"
      - name: Use the locked Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install the locked scientific runtime
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements-ci.txt
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked npm 12.0.2
        run: node scripts/install-locked-npm.mjs
      - name: Verify locked npm 12.0.2
        run: test "$(npm --version)" = "12.0.2"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high --package-lock-only --fetch-timeout=30000 --fetch-retries=1
      - name: Run the full repository gate
        run: npm run check
      - name: Set up the locked PDF Docker Buildx client
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Render the immutable tag-bound book
        env:
          RELEASE_COMMIT: ${{ steps.release-ref.outputs.commit }}
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
        run: npm run generate:book-pdf -- --ref "$RELEASE_TAG" --revision "$RELEASE_COMMIT"
      - name: Build the native 20w convenience binary
        env:
          RELEASE_COMMIT: ${{ steps.release-ref.outputs.commit }}
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
        run: |
          set -euo pipefail
          source_timestamp="$(git show -s --format=%cI "$RELEASE_COMMIT")"
          go -C tooling run ./cmd/build-release \
            --version "$RELEASE_TAG" \
            --revision "$RELEASE_COMMIT" \
            --built-at "$source_timestamp" \
            --output-root ../build/release-inputs
      - name: Execute the native release binary and materialize the experiment plan
        run: |
          set -euo pipefail
          ./build/release-inputs/20w-linux-amd64 version --json
          ./build/release-inputs/20w-linux-amd64 validate docs --root .
          go -C tooling run ./cmd/20w experiment release-plan --root .. --json > build/release-inputs/experiment-release-plan.json
      - name: Rebuild the final PDF renderer twice without cache
        env:
          RELEASE_COMMIT: ${{ steps.release-ref.outputs.commit }}
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
        run: >-
          ./build/release-inputs/20w-linux-amd64
          publication verify-pdf-reproducibility
          --root . --ref "$RELEASE_TAG"
          --revision "$RELEASE_COMMIT"
          --receipt build/release-inputs/pdf-renderer-reproducibility.json
      - name: Prepare version-bound release assets
        env:
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
        run: |
          set -euo pipefail
          npm run prepare:release -- --tag "$RELEASE_TAG" --additional-assets-root build/release-inputs
      - name: Upload the verified release workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: research-release-${{ steps.release-ref.outputs.tag }}
          path: build/release
          if-no-files-found: error
          retention-days: 1

  release:
    name: Attest and publish release assets and experiment images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release-tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Reconfirm the immutable release input
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          set -euo pipefail
          tagged_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$RELEASE_COMMIT" || "$tagged_commit" != "$RELEASE_COMMIT" ]]; then
            echo "::error::release tag moved after verification"
            exit 1
          fi
      - name: Derive the lowercase registry repository
        run: |
          set -euo pipefail
          image_repository="${GITHUB_REPOSITORY,,}"
          if [[ ! "$image_repository" =~ ^[a-z0-9]([a-z0-9._-]{0,99}[a-z0-9])?/[a-z0-9]([a-z0-9._-]{0,99}[a-z0-9])?$ ]]; then
            echo "::error::repository identity does not lowercase to a bounded OCI owner/name"
            exit 1
          fi
          printf 'IMAGE_REPOSITORY=%s\n' "$image_repository" >> "$GITHUB_ENV"
      - name: Use Go 1.27 for closed image contexts
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Download the verified release workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: research-release-${{ needs.verify.outputs.release-tag }}
          path: build/release
      - name: Preflight the remote release without mutation
        id: release-preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          comparison_root="$(mktemp -d "${RUNNER_TEMP}/20w-release-preflight.XXXXXX")"
          cleanup() {
            rm -rf -- "$comparison_root"
          }
          trap cleanup EXIT
          expected_inventory="$comparison_root/expected-assets.txt"
          remote_inventory="$comparison_root/remote-assets.txt"
          published_inventory="$comparison_root/published-assets.txt"
          checksum_manifest="build/release/assets/SHA256SUMS"
          go -C tooling run ./cmd/20w release asset-inventory \
            --assets ../build/release/assets \
            --phase source > "$expected_inventory"
          cp "$expected_inventory" "$published_inventory"
          printf '%s\n' "oci-images.json" >> "$published_inventory"
          sort --output="$published_inventory" "$published_inventory"

          compare_asset() {
            local name="$1"
            local downloaded="$2"
            local expected="build/release/assets/${name}"
            local expected_sha
            local downloaded_sha
            expected_sha="$(sha256sum "$expected" | awk '{print $1}')"
            downloaded_sha="$(sha256sum "$downloaded" | awk '{print $1}')"
            if [[ "$expected_sha" != "$downloaded_sha" ]] || ! cmp --silent -- "$expected" "$downloaded"; then
              echo "::error::existing release asset differs from the local asset: ${name}"
              exit 1
            fi
          }

          go -C tooling run ./cmd/20w release verify-tag \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"
          release_state_row="$(
            go -C tooling run ./cmd/20w release state \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$RELEASE_TAG"
          )"
          if [[ "$release_state_row" == "absent" ]]; then
            printf '%s\n' \
              "release_state=absent" \
              "release_id=" \
              "oci_manifest=absent" \
              "remote_checksum=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::an existing release may be checked or repaired only by an explicit manual dispatch"
            exit 1
          fi

          IFS=$'\t' read -r release_presence release_id release_draft release_prerelease release_immutable release_state_tag trailing \
            <<< "$release_state_row"
          if [[ "$release_presence" != "present" || -n "${trailing:-}" \
            || "$release_state_tag" != "$RELEASE_TAG" \
            || ! "$release_id" =~ ^[1-9][0-9]*$ \
            || ! "$release_draft" =~ ^(true|false)$ \
            || ! "$release_prerelease" =~ ^(true|false)$ \
            || ! "$release_immutable" =~ ^(true|false)$ ]]; then
            echo "::error::GitHub Release state is malformed"
            exit 1
          fi
          if [[ "$release_prerelease" != "false" ]]; then
            echo "::error::the release is unexpectedly marked as a prerelease"
            exit 1
          fi

          existing_root="$comparison_root/existing"
          go -C tooling run ./cmd/20w release fetch-assets \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$release_id" \
            --expected-assets ../build/release/assets \
            --phase source \
            --output "$existing_root" \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_COMMIT" > "$remote_inventory"
          mapfile -t remote_assets < "$remote_inventory"
          declare -A remote_by_name=()
          for name in "${remote_assets[@]}"; do
            remote_by_name["$name"]=1
            if [[ "$name" != "SHA256SUMS" && "$name" != "oci-images.json" ]]; then
              compare_asset "$name" "$existing_root/$name"
            fi
          done

          oci_manifest=absent
          remote_checksum=absent
          if [[ -n "${remote_by_name[oci-images.json]+present}" ]]; then
            go -C tooling run ./cmd/20w release validate-oci-images \
              --input "$existing_root/oci-images.json" \
              --repository "$IMAGE_REPOSITORY" \
              --tag "$RELEASE_TAG" \
              --revision "$RELEASE_COMMIT"
            cp "$existing_root/oci-images.json" build/release/assets/oci-images.json
            oci_manifest=present
          fi
          if [[ -n "${remote_by_name[SHA256SUMS]+present}" ]]; then
            remote_checksum=present
            remote_checksum_manifest="$existing_root/SHA256SUMS"
            oci_argument=()
            if [[ "$oci_manifest" == "present" ]]; then
              oci_argument=(--oci "$existing_root/oci-images.json")
            fi
            go -C tooling run ./cmd/20w release compare-publication-manifest \
              --source "../$checksum_manifest" \
              --publication "$remote_checksum_manifest" \
              "${oci_argument[@]}"
            if [[ "$oci_manifest" == "present" ]]; then
              cp "$remote_checksum_manifest" "$checksum_manifest"
            else
              cp "$remote_checksum_manifest" build/release/existing-draft-SHA256SUMS
            fi
          fi

          case "$release_draft:$release_immutable" in
            true:false)
              release_state=draft
              ;;
            false:true)
              if [[ "$oci_manifest" != "present" || "$remote_checksum" != "present" ]] \
                || ! diff --unified=0 "$published_inventory" "$remote_inventory"; then
                echo "::error::published immutable release assets are incomplete"
                exit 1
              fi
              release_state=published
              ;;
            *)
              echo "::error::release is neither a mutable draft nor an immutable publication"
              exit 1
              ;;
          esac
          printf '%s\n' \
            "release_state=${release_state}" \
            "release_id=${release_id}" \
            "oci_manifest=${oci_manifest}" \
            "remote_checksum=${remote_checksum}" >> "$GITHUB_OUTPUT"
      - name: Build the closed release helper
        run: |
          set -euo pipefail
          mkdir -p build/release-tools
          go -C tooling build -trimpath -buildvcs=false -o ../build/release-tools/20w ./cmd/20w
      - name: Set up Docker Buildx
        if: steps.release-preflight.outputs.release_state != 'published'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Authenticate to GitHub Container Registry
        if: steps.release-preflight.outputs.release_state != 'published'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Inspect existing release image tags
        if: steps.release-preflight.outputs.release_state != 'published'
        id: image-status
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          RELEASE_TIMESTAMP: ${{ needs.verify.outputs.release-timestamp }}
        run: |
          set -euo pipefail
          tool=build/release-tools/20w
          "$tool" release inspect-image \
            --image "ghcr.io/${IMAGE_REPOSITORY}-20w" \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_COMMIT" \
            --platform linux/amd64 \
            --expected-label "org.opencontainers.image.created=$RELEASE_TIMESTAMP" \
            --expected-label "org.opencontainers.image.version=$RELEASE_TAG" \
            --expected-label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --expected-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --expected-label "io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${IMAGE_REPOSITORY}-20w" \
            --github-output-prefix tooling >> "$GITHUB_OUTPUT"
          for fixture in fixture-007 fixture-019; do
            prefix="${fixture//-/}"
            "$tool" release inspect-image \
              --image "ghcr.io/${IMAGE_REPOSITORY}-${fixture}" \
              --tag "$RELEASE_TAG" \
              --revision "$RELEASE_COMMIT" \
              --platform linux/amd64 \
              --expected-label "org.opencontainers.image.created=$RELEASE_TIMESTAMP" \
              --expected-label "org.opencontainers.image.version=$RELEASE_TAG" \
              --expected-label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
              --expected-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --expected-label "io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${IMAGE_REPOSITORY}-${fixture}" \
              --expected-label "io.github.lusoris.20-watts-was-enough.result-authority=NO_RESULT" \
              --github-output-prefix "$prefix" >> "$GITHUB_OUTPUT"
          done
      - name: Derive 20w image tags and labels
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.tooling_publish == 'true'
        id: tooling-image-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_REPOSITORY }}-20w
          flavor: latest=false
          tags: type=raw,value=${{ needs.verify.outputs.release-tag }}
          labels: |
            org.opencontainers.image.title=20 Watts Was Enough command
            org.opencontainers.image.description=Static repository validation and experiment catalogue command
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.release-tag }}
            org.opencontainers.image.created=${{ needs.verify.outputs.release-timestamp }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.release-commit }}
            org.opencontainers.image.licenses=EUPL-1.2
            io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${{ env.IMAGE_REPOSITORY }}-20w
      - name: Build and push the untagged static 20w candidate
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.tooling_publish == 'true'
        id: build-tooling-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tooling/Dockerfile
          platforms: linux/amd64
          outputs: type=registry,name=ghcr.io/${{ env.IMAGE_REPOSITORY }}-20w,push-by-digest=true,name-canonical=true
          labels: ${{ steps.tooling-image-metadata.outputs.labels }}
          build-args: |
            IMAGE_NAME=ghcr.io/${{ env.IMAGE_REPOSITORY }}-20w
            IMAGE_VERSION=${{ needs.verify.outputs.release-tag }}
            SOURCE_REVISION=${{ needs.verify.outputs.release-commit }}
            SOURCE_TIMESTAMP=${{ needs.verify.outputs.release-timestamp }}
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=20w-tooling-image
          cache-to: type=gha,mode=max,scope=20w-tooling-image
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.release-epoch }}
      - name: Package the closed Fixture 007 runtime context
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.fixture007_publish == 'true'
        run: go -C tooling run ./cmd/20w experiment package-node-image --root .. --artifact fixture-007 --output ../build/container-contexts/fixture-007
      - name: Derive Fixture 007 image tags and labels
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.fixture007_publish == 'true'
        id: fixture-007-image-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-007
          flavor: latest=false
          tags: type=raw,value=${{ needs.verify.outputs.release-tag }}
          labels: |
            org.opencontainers.image.title=20 Watts Was Enough Fixture 007 runtime
            org.opencontainers.image.description=Scoped Node.js runtime for the bounded Fixture 007 NO_RESULT diagnostic
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.release-tag }}
            org.opencontainers.image.created=${{ needs.verify.outputs.release-timestamp }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.release-commit }}
            org.opencontainers.image.licenses=EUPL-1.2
            io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-007
            io.github.lusoris.20-watts-was-enough.result-authority=NO_RESULT
      - name: Build and push the untagged Fixture 007 candidate
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.fixture007_publish == 'true'
        id: build-fixture-007-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/container-contexts/fixture-007
          file: experiments/workstation/Dockerfile.node-artifact
          platforms: linux/amd64
          outputs: type=registry,name=ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-007,push-by-digest=true,name-canonical=true
          labels: ${{ steps.fixture-007-image-metadata.outputs.labels }}
          build-args: |
            EXPERIMENT_ARTIFACT=fixture-007
            IMAGE_NAME=ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-007
            IMAGE_VERSION=${{ needs.verify.outputs.release-tag }}
            SOURCE_REVISION=${{ needs.verify.outputs.release-commit }}
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=fixture-007-image
          cache-to: type=gha,mode=max,scope=fixture-007-image
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.release-epoch }}
      - name: Package the closed Fixture 019 runtime context
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.fixture019_publish == 'true'
        run: go -C tooling run ./cmd/20w experiment package-node-image --root .. --artifact fixture-019 --output ../build/container-contexts/fixture-019
      - name: Derive Fixture 019 image tags and labels
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.fixture019_publish == 'true'
        id: fixture-019-image-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-019
          flavor: latest=false
          tags: type=raw,value=${{ needs.verify.outputs.release-tag }}
          labels: |
            org.opencontainers.image.title=20 Watts Was Enough Fixture 019 runtime
            org.opencontainers.image.description=Scoped CPython and NumPy runtime for the bounded Fixture 019 NO_RESULT harness
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.release-tag }}
            org.opencontainers.image.created=${{ needs.verify.outputs.release-timestamp }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.release-commit }}
            org.opencontainers.image.licenses=EUPL-1.2
            io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-019
            io.github.lusoris.20-watts-was-enough.result-authority=NO_RESULT
      - name: Build and push the untagged Fixture 019 candidate
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.fixture019_publish == 'true'
        id: build-fixture-019-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/container-contexts/fixture-019
          file: experiments/workstation/fixture-019/Dockerfile
          platforms: linux/amd64
          outputs: type=registry,name=ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-019,push-by-digest=true,name-canonical=true
          labels: ${{ steps.fixture-019-image-metadata.outputs.labels }}
          build-args: |
            IMAGE_NAME=ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-019
            IMAGE_VERSION=${{ needs.verify.outputs.release-tag }}
            SOURCE_REVISION=${{ needs.verify.outputs.release-commit }}
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=fixture-019-image
          cache-to: type=gha,mode=max,scope=fixture-019-image
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.release-epoch }}
      - name: Select exact image digests for admission
        if: steps.release-preflight.outputs.release_state != 'published'
        id: admission-images
        env:
          TOOLING_PUBLISH: ${{ steps.image-status.outputs.tooling_publish }}
          TOOLING_EXISTING: ${{ steps.image-status.outputs.tooling_digest }}
          TOOLING_BUILD: ${{ steps.build-tooling-image.outputs.digest }}
          FIXTURE_007_PUBLISH: ${{ steps.image-status.outputs.fixture007_publish }}
          FIXTURE_007_EXISTING: ${{ steps.image-status.outputs.fixture007_digest }}
          FIXTURE_007_BUILD: ${{ steps.build-fixture-007-image.outputs.digest }}
          FIXTURE_019_PUBLISH: ${{ steps.image-status.outputs.fixture019_publish }}
          FIXTURE_019_EXISTING: ${{ steps.image-status.outputs.fixture019_digest }}
          FIXTURE_019_BUILD: ${{ steps.build-fixture-019-image.outputs.digest }}
        run: |
          set -euo pipefail
          select_digest() {
            local prefix="$1"
            local publish="$2"
            local existing="$3"
            local built="$4"
            local selected
            case "$publish" in
              true) selected="$built" ;;
              false) selected="$existing" ;;
              *) echo "::error::image publication state is invalid"; return 1 ;;
            esac
            if [[ ! "$selected" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::selected image digest is absent or malformed"
              return 1
            fi
            printf '%s_digest=%s\n' "$prefix" "$selected" >> "$GITHUB_OUTPUT"
          }
          select_digest tooling "$TOOLING_PUBLISH" "$TOOLING_EXISTING" "$TOOLING_BUILD"
          select_digest fixture007 "$FIXTURE_007_PUBLISH" "$FIXTURE_007_EXISTING" "$FIXTURE_007_BUILD"
          select_digest fixture019 "$FIXTURE_019_PUBLISH" "$FIXTURE_019_EXISTING" "$FIXTURE_019_BUILD"
      - name: Validate the exact image digests before admission
        if: steps.release-preflight.outputs.release_state != 'published'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          RELEASE_TIMESTAMP: ${{ needs.verify.outputs.release-timestamp }}
          TOOLING_DIGEST: ${{ steps.admission-images.outputs.tooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.admission-images.outputs.fixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.admission-images.outputs.fixture019_digest }}
        run: |
          set -euo pipefail
          tool=build/release-tools/20w
          "$tool" release inspect-image \
            --image "ghcr.io/${IMAGE_REPOSITORY}-20w" \
            --digest "$TOOLING_DIGEST" \
            --require-existing \
            --revision "$RELEASE_COMMIT" \
            --platform linux/amd64 \
            --expected-label "org.opencontainers.image.created=$RELEASE_TIMESTAMP" \
            --expected-label "org.opencontainers.image.version=$RELEASE_TAG" \
            --expected-label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --expected-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --expected-label "io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${IMAGE_REPOSITORY}-20w"
          for fixture in fixture-007 fixture-019; do
            if [[ "$fixture" == "fixture-007" ]]; then
              digest="$FIXTURE_007_DIGEST"
            else
              digest="$FIXTURE_019_DIGEST"
            fi
            "$tool" release inspect-image \
              --image "ghcr.io/${IMAGE_REPOSITORY}-${fixture}" \
              --digest "$digest" \
              --require-existing \
              --revision "$RELEASE_COMMIT" \
              --platform linux/amd64 \
              --expected-label "org.opencontainers.image.created=$RELEASE_TIMESTAMP" \
              --expected-label "org.opencontainers.image.version=$RELEASE_TAG" \
              --expected-label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
              --expected-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --expected-label "io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${IMAGE_REPOSITORY}-${fixture}" \
              --expected-label "io.github.lusoris.20-watts-was-enough.result-authority=NO_RESULT"
          done
      - name: Run the admitted candidates by immutable digest
        if: steps.release-preflight.outputs.release_state != 'published'
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          RELEASE_TIMESTAMP: ${{ needs.verify.outputs.release-timestamp }}
          TOOLING_DIGEST: ${{ steps.admission-images.outputs.tooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.admission-images.outputs.fixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.admission-images.outputs.fixture019_digest }}
        run: |
          set -euo pipefail
          tooling="ghcr.io/${IMAGE_REPOSITORY}-20w@${TOOLING_DIGEST}"
          fixture_007="ghcr.io/${IMAGE_REPOSITORY}-fixture-007@${FIXTURE_007_DIGEST}"
          fixture_019="ghcr.io/${IMAGE_REPOSITORY}-fixture-019@${FIXTURE_019_DIGEST}"
          docker pull "$tooling"
          docker pull "$fixture_007"
          docker pull "$fixture_019"
          tooling_identity="$(docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            "$tooling" version --json)"
          expected_tooling_identity="$(printf '{"version":"%s","revision":"%s","built_at":"%s","go_version":"go1.27.1","os":"linux","architecture":"amd64"}' \
            "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_TIMESTAMP")"
          if [[ "$tooling_identity" != "$expected_tooling_identity" ]]; then
            echo "::error::admitted 20w binary identity does not match the tag, commit, timestamp, Go version, OS, and architecture"
            printf 'actual:   %s\nexpected: %s\n' "$tooling_identity" "$expected_tooling_identity"
            exit 1
          fi
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            "$tooling" validate docs --root /repo
          fixture_007_node="$(docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node "$fixture_007" --version)"
          if [[ "$fixture_007_node" != "v26.8.1" ]]; then
            echo "::error::admitted Fixture 007 Node.js runtime is $fixture_007_node, want v26.8.1"
            exit 1
          fi
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint sh "$fixture_019" -c \
            'test "$(node --version)" = "v26.8.1" && test "$(python --version)" = "Python 3.14.7" && python -c "import numpy; assert numpy.__version__ == \"2.5.2\""'
          volume_007="20w-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-007"
          volume_019="20w-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-019"
          docker volume create "$volume_007"
          docker volume create "$volume_019"
          cleanup() {
            docker volume rm "$volume_007" "$volume_019" >/dev/null
          }
          trap cleanup EXIT
          for action in smoke analyze validate; do
            if [[ "$action" == "smoke" ]]; then
              arguments=(smoke --profile smoke --output /workspace/results/smoke)
            else
              arguments=("$action" --output /workspace/results/smoke)
            fi
            docker run --rm --pull never --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --env "EXPERIMENT_IMAGE_DIGEST=$FIXTURE_007_DIGEST" \
              --mount "type=volume,src=$volume_007,dst=/results" \
              "$fixture_007" "${arguments[@]}"
          done
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --env "EXPERIMENT_IMAGE_DIGEST=$FIXTURE_019_DIGEST" \
            --mount "type=volume,src=$volume_019,dst=/workspace/results" \
            "$fixture_019" smoke --profile smoke --output /workspace/results/smoke --resume false
          for action in analyze validate; do
            docker run --rm --pull never --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --env "EXPERIMENT_IMAGE_DIGEST=$FIXTURE_019_DIGEST" \
              --mount "type=volume,src=$volume_019,dst=/workspace/results" \
              "$fixture_019" "$action" --output /workspace/results/smoke
          done
      - name: Attest the freshly built static 20w digest
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.tooling_publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_REPOSITORY }}-20w
          subject-digest: ${{ steps.build-tooling-image.outputs.digest }}
          push-to-registry: true
      - name: Attest the freshly built Fixture 007 digest
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.fixture007_publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-007
          subject-digest: ${{ steps.build-fixture-007-image.outputs.digest }}
          push-to-registry: true
      - name: Attest the freshly built Fixture 019 digest
        if: steps.release-preflight.outputs.release_state != 'published' && steps.image-status.outputs.fixture019_publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_REPOSITORY }}-fixture-019
          subject-digest: ${{ steps.build-fixture-019-image.outputs.digest }}
          push-to-registry: true
      - name: Verify admitted image provenance against the tag source
        if: steps.release-preflight.outputs.release_state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          TOOLING_DIGEST: ${{ steps.admission-images.outputs.tooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.admission-images.outputs.fixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.admission-images.outputs.fixture019_digest }}
        run: |
          set -euo pipefail
          verify_image() {
            local image_name="$1"
            local digest="$2"
            local attempt
            local delay
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "oci://${image_name}@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$RELEASE_COMMIT" \
                --source-ref "refs/tags/$RELEASE_TAG"; then
                return 0
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::image provenance did not converge after five verification attempts"
                return 1
              fi
              delay=$((attempt * 2))
              echo "::notice::image provenance is not visible yet; retrying in ${delay}s (attempt ${attempt}/5)"
              sleep "$delay"
            done
          }
          verify_image "ghcr.io/${IMAGE_REPOSITORY}-20w" "$TOOLING_DIGEST"
          verify_image "ghcr.io/${IMAGE_REPOSITORY}-fixture-007" "$FIXTURE_007_DIGEST"
          verify_image "ghcr.io/${IMAGE_REPOSITORY}-fixture-019" "$FIXTURE_019_DIGEST"
      - name: Attach missing release tags to admitted digests
        if: steps.release-preflight.outputs.release_state != 'published'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          RELEASE_TIMESTAMP: ${{ needs.verify.outputs.release-timestamp }}
          TOOLING_PUBLISH: ${{ steps.image-status.outputs.tooling_publish }}
          TOOLING_DIGEST: ${{ steps.admission-images.outputs.tooling_digest }}
          FIXTURE_007_PUBLISH: ${{ steps.image-status.outputs.fixture007_publish }}
          FIXTURE_007_DIGEST: ${{ steps.admission-images.outputs.fixture007_digest }}
          FIXTURE_019_PUBLISH: ${{ steps.image-status.outputs.fixture019_publish }}
          FIXTURE_019_DIGEST: ${{ steps.admission-images.outputs.fixture019_digest }}
        run: |
          set -euo pipefail
          tool=build/release-tools/20w
          publish_tag() {
            local image_name="$1"
            local digest="$2"
            local publish="$3"
            local authority="$4"
            local observation
            local -a arguments
            if [[ "$publish" == "false" ]]; then
              return 0
            fi
            if [[ "$publish" != "true" ]]; then
              echo "::error::image publication state is invalid"
              return 1
            fi
            arguments=(
              --image "$image_name"
              --tag "$RELEASE_TAG"
              --revision "$RELEASE_COMMIT"
              --platform linux/amd64
              --expected-label "org.opencontainers.image.created=$RELEASE_TIMESTAMP"
              --expected-label "org.opencontainers.image.version=$RELEASE_TAG"
              --expected-label "org.opencontainers.image.revision=$RELEASE_COMMIT"
              --expected-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
              --expected-label "io.github.lusoris.20-watts-was-enough.image-name=$image_name"
              --github-output-prefix candidate
            )
            if [[ "$authority" == "NO_RESULT" ]]; then
              arguments+=(--expected-label "io.github.lusoris.20-watts-was-enough.result-authority=NO_RESULT")
            fi
            observation="$("$tool" release inspect-image "${arguments[@]}")"
            if ! grep -qx 'candidate_status=absent' <<< "$observation"; then
              echo "::error::refusing to overwrite an image tag that became present during admission"
              return 1
            fi
            docker buildx imagetools create \
              --tag "${image_name}:${RELEASE_TAG}" \
              "${image_name}@${digest}"
          }
          publish_tag "ghcr.io/${IMAGE_REPOSITORY}-20w" "$TOOLING_DIGEST" "$TOOLING_PUBLISH" tooling
          publish_tag "ghcr.io/${IMAGE_REPOSITORY}-fixture-007" "$FIXTURE_007_DIGEST" "$FIXTURE_007_PUBLISH" NO_RESULT
          publish_tag "ghcr.io/${IMAGE_REPOSITORY}-fixture-019" "$FIXTURE_019_DIGEST" "$FIXTURE_019_PUBLISH" NO_RESULT
      - name: Resolve and validate the final release image tags
        if: steps.release-preflight.outputs.release_state != 'published'
        id: final-images
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          RELEASE_TIMESTAMP: ${{ needs.verify.outputs.release-timestamp }}
        run: |
          set -euo pipefail
          tool=build/release-tools/20w
          inspect_final_image() {
            local prefix="$1"
            shift
            local attempt
            local delay
            local output
            output="$(mktemp)"
            for attempt in 1 2 3 4 5 6; do
              : > "$output"
              if "$tool" release inspect-image "$@" \
                --require-existing \
                --github-output-prefix "$prefix" > "$output"; then
                cat "$output" >> "$GITHUB_OUTPUT"
                rm -f "$output"
                return 0
              fi
              if [[ "$attempt" -eq 6 ]]; then
                rm -f "$output"
                echo "::error::release image tag did not converge after six registry inspections"
                return 1
              fi
              delay=$((attempt * 2))
              echo "::notice::registry identity is not visible yet; retrying in ${delay}s (attempt ${attempt}/6)"
              sleep "$delay"
            done
          }
          inspect_final_image finaltooling \
            --image "ghcr.io/${IMAGE_REPOSITORY}-20w" \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_COMMIT" \
            --platform linux/amd64 \
            --expected-label "org.opencontainers.image.created=$RELEASE_TIMESTAMP" \
            --expected-label "org.opencontainers.image.version=$RELEASE_TAG" \
            --expected-label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --expected-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --expected-label "io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${IMAGE_REPOSITORY}-20w"
          for fixture in fixture-007 fixture-019; do
            prefix="final${fixture//-/}"
            inspect_final_image "$prefix" \
              --image "ghcr.io/${IMAGE_REPOSITORY}-${fixture}" \
              --tag "$RELEASE_TAG" \
              --revision "$RELEASE_COMMIT" \
              --platform linux/amd64 \
              --expected-label "org.opencontainers.image.created=$RELEASE_TIMESTAMP" \
              --expected-label "org.opencontainers.image.version=$RELEASE_TAG" \
              --expected-label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
              --expected-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --expected-label "io.github.lusoris.20-watts-was-enough.image-name=ghcr.io/${IMAGE_REPOSITORY}-${fixture}" \
              --expected-label "io.github.lusoris.20-watts-was-enough.result-authority=NO_RESULT"
          done
      - name: Bind final release tags to the admitted digests
        if: steps.release-preflight.outputs.release_state != 'published'
        env:
          TOOLING_ADMITTED: ${{ steps.admission-images.outputs.tooling_digest }}
          TOOLING_FINAL: ${{ steps.final-images.outputs.finaltooling_digest }}
          FIXTURE_007_ADMITTED: ${{ steps.admission-images.outputs.fixture007_digest }}
          FIXTURE_007_FINAL: ${{ steps.final-images.outputs.finalfixture007_digest }}
          FIXTURE_019_ADMITTED: ${{ steps.admission-images.outputs.fixture019_digest }}
          FIXTURE_019_FINAL: ${{ steps.final-images.outputs.finalfixture019_digest }}
        run: |
          set -euo pipefail
          require_digest_match() {
            local admitted="$1"
            local resolved="$2"
            if [[ "$admitted" != "$resolved" ]]; then
              echo "::error::final image tag does not resolve to the admitted digest"
              return 1
            fi
          }
          require_digest_match "$TOOLING_ADMITTED" "$TOOLING_FINAL"
          require_digest_match "$FIXTURE_007_ADMITTED" "$FIXTURE_007_FINAL"
          require_digest_match "$FIXTURE_019_ADMITTED" "$FIXTURE_019_FINAL"
      - name: Prove final image digests are anonymously pullable
        if: steps.release-preflight.outputs.release_state != 'published'
        env:
          TOOLING_DIGEST: ${{ steps.final-images.outputs.finaltooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.final-images.outputs.finalfixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.final-images.outputs.finalfixture019_digest }}
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d "${RUNNER_TEMP}/20w-anonymous-docker.XXXXXX")"
          cleanup() {
            rm -rf -- "$anonymous_config"
          }
          trap cleanup EXIT
          printf '%s\n' '{"auths":{}}' > "$anonymous_config/config.json"
          images=(
            "ghcr.io/${IMAGE_REPOSITORY}-20w@${TOOLING_DIGEST}"
            "ghcr.io/${IMAGE_REPOSITORY}-fixture-007@${FIXTURE_007_DIGEST}"
            "ghcr.io/${IMAGE_REPOSITORY}-fixture-019@${FIXTURE_019_DIGEST}"
          )
          for image in "${images[@]}"; do
            if ! DOCKER_CONFIG="$anonymous_config" docker pull "$image"; then
              echo "::error::${image} is not anonymously pullable. GitHub creates new packages as private; set all three release packages to Public in their package settings, then manually rerun this exact tag."
              exit 1
            fi
          done
      - name: Materialize the immutable OCI image authority
        if: steps.release-preflight.outputs.release_state != 'published'
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          TOOLING_DIGEST: ${{ steps.final-images.outputs.finaltooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.final-images.outputs.finalfixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.final-images.outputs.finalfixture019_digest }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          generated_root="$(mktemp -d "${RUNNER_TEMP}/20w-oci-images.XXXXXX")"
          cleanup() {
            rm -rf -- "$generated_root"
          }
          trap cleanup EXIT
          tool=build/release-tools/20w
          assets=build/release/assets
          generated_manifest="$generated_root/oci-images.json"
          "$tool" release write-oci-images \
            --output "$generated_manifest" \
            --repository "$IMAGE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_COMMIT" \
            --tooling-digest "$TOOLING_DIGEST" \
            --fixture-007-digest "$FIXTURE_007_DIGEST" \
            --fixture-019-digest "$FIXTURE_019_DIGEST"
          if [[ -e "$assets/oci-images.json" || -L "$assets/oci-images.json" ]]; then
            if [[ ! -f "$assets/oci-images.json" || -L "$assets/oci-images.json" ]] \
              || ! cmp --silent -- "$generated_manifest" "$assets/oci-images.json"; then
              echo "::error::existing draft oci-images.json differs from the final release image identities"
              exit 1
            fi
          else
            mv "$generated_manifest" "$assets/oci-images.json"
          fi
          oci_sha="$(sha256sum "$assets/oci-images.json" | awk '{print $1}')"
          grep -v '  oci-images.json$' "$assets/SHA256SUMS" > "$generated_root/SHA256SUMS"
          printf '%s  %s\n' "$oci_sha" "oci-images.json" >> "$generated_root/SHA256SUMS"
          sort --key=2,2 --output="$generated_root/SHA256SUMS" "$generated_root/SHA256SUMS"
          if [[ -f build/release/existing-draft-SHA256SUMS ]]; then
            if ! cmp --silent -- "$generated_root/SHA256SUMS" build/release/existing-draft-SHA256SUMS; then
              echo "::error::existing draft SHA256SUMS differs from the final generated OCI identity"
              exit 1
            fi
            cp build/release/existing-draft-SHA256SUMS "$assets/SHA256SUMS"
          elif grep -q '  oci-images.json$' "$assets/SHA256SUMS"; then
            if ! cmp --silent -- "$generated_root/SHA256SUMS" "$assets/SHA256SUMS"; then
              echo "::error::hydrated SHA256SUMS differs from the final generated OCI identity"
              exit 1
            fi
          else
            cp "$generated_root/SHA256SUMS" "$assets/SHA256SUMS"
          fi
          "$tool" release asset-inventory \
            --assets "$assets" \
            --phase publication > /dev/null
          "$tool" release validate-oci-images \
            --input "$assets/oci-images.json" \
            --repository "$IMAGE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_COMMIT"
      - name: Resolve the immutable OCI image authority
        id: release-images
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          set -euo pipefail
          build/release-tools/20w release validate-oci-images \
            --input build/release/assets/oci-images.json \
            --repository "$IMAGE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --revision "$RELEASE_COMMIT" \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Validate persisted release image identities and tag bindings
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          RELEASE_TIMESTAMP: ${{ needs.verify.outputs.release-timestamp }}
          TOOLING_DIGEST: ${{ steps.release-images.outputs.tooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.release-images.outputs.fixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.release-images.outputs.fixture019_digest }}
        run: |
          set -euo pipefail
          tool=build/release-tools/20w
          validate_tag_binding() {
            local image_name="$1"
            local expected_digest="$2"
            local authority="$3"
            local output
            local -a arguments
            output="$(mktemp)"
            arguments=(
              --image "$image_name"
              --tag "$RELEASE_TAG"
              --revision "$RELEASE_COMMIT"
              --platform linux/amd64
              --require-existing
              --expected-label "org.opencontainers.image.created=$RELEASE_TIMESTAMP"
              --expected-label "org.opencontainers.image.version=$RELEASE_TAG"
              --expected-label "org.opencontainers.image.revision=$RELEASE_COMMIT"
              --expected-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
              --expected-label "io.github.lusoris.20-watts-was-enough.image-name=$image_name"
              --github-output-prefix persisted
            )
            if [[ "$authority" == "NO_RESULT" ]]; then
              arguments+=(--expected-label "io.github.lusoris.20-watts-was-enough.result-authority=NO_RESULT")
            fi
            "$tool" release inspect-image "${arguments[@]}" > "$output"
            if ! grep -qx 'persisted_status=existing' "$output" \
              || ! grep -qx "persisted_digest=${expected_digest}" "$output"; then
              echo "::error::${image_name}:${RELEASE_TAG} is not bound to its persisted release digest"
              rm -f "$output"
              exit 1
            fi
            rm -f "$output"
          }
          validate_tag_binding "ghcr.io/${IMAGE_REPOSITORY}-20w" "$TOOLING_DIGEST" tooling
          validate_tag_binding "ghcr.io/${IMAGE_REPOSITORY}-fixture-007" "$FIXTURE_007_DIGEST" NO_RESULT
          validate_tag_binding "ghcr.io/${IMAGE_REPOSITORY}-fixture-019" "$FIXTURE_019_DIGEST" NO_RESULT
      - name: Verify persisted image provenance against the tag source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          TOOLING_DIGEST: ${{ steps.release-images.outputs.tooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.release-images.outputs.fixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.release-images.outputs.fixture019_digest }}
        run: |
          set -euo pipefail
          verify_image() {
            local image_name="$1"
            local digest="$2"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "oci://${image_name}@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$RELEASE_COMMIT" \
                --source-ref "refs/tags/$RELEASE_TAG"; then
                return 0
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::persisted image provenance did not converge after five verification attempts"
                return 1
              fi
              sleep "$((attempt * 2))"
            done
          }
          verify_image "ghcr.io/${IMAGE_REPOSITORY}-20w" "$TOOLING_DIGEST"
          verify_image "ghcr.io/${IMAGE_REPOSITORY}-fixture-007" "$FIXTURE_007_DIGEST"
          verify_image "ghcr.io/${IMAGE_REPOSITORY}-fixture-019" "$FIXTURE_019_DIGEST"
      - name: Revalidate persisted image digests anonymously
        env:
          TOOLING_DIGEST: ${{ steps.release-images.outputs.tooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.release-images.outputs.fixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.release-images.outputs.fixture019_digest }}
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d "${RUNNER_TEMP}/20w-persisted-anonymous-docker.XXXXXX")"
          cleanup() {
            rm -rf -- "$anonymous_config"
          }
          trap cleanup EXIT
          printf '%s\n' '{"auths":{}}' > "$anonymous_config/config.json"
          images=(
            "ghcr.io/${IMAGE_REPOSITORY}-20w@${TOOLING_DIGEST}"
            "ghcr.io/${IMAGE_REPOSITORY}-fixture-007@${FIXTURE_007_DIGEST}"
            "ghcr.io/${IMAGE_REPOSITORY}-fixture-019@${FIXTURE_019_DIGEST}"
          )
          for image in "${images[@]}"; do
            if ! DOCKER_CONFIG="$anonymous_config" docker pull "$image"; then
              echo "::error::persisted release image ${image} is not anonymously pullable"
              exit 1
            fi
          done
      - name: Attest the complete release asset inventory
        if: steps.release-preflight.outputs.release_state != 'published'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: build/release/assets/*
      - name: Verify the complete release-asset attestations against the tag source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          set -euo pipefail
          verify_asset() {
            local asset="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$RELEASE_COMMIT" \
                --source-ref "refs/tags/$RELEASE_TAG"; then
                return 0
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::release-asset provenance did not converge after five verification attempts"
                return 1
              fi
              sleep "$((attempt * 2))"
            done
          }
          for asset in build/release/assets/*; do
            verify_asset "$asset"
          done
      - name: Add immutable container identities to the release notes
        if: steps.release-preflight.outputs.release_state != 'published'
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
          TOOLING_DIGEST: ${{ steps.release-images.outputs.tooling_digest }}
          FIXTURE_007_DIGEST: ${{ steps.release-images.outputs.fixture007_digest }}
          FIXTURE_019_DIGEST: ${{ steps.release-images.outputs.fixture019_digest }}
        run: |
          set -euo pipefail
          notes=build/release/published-release-notes.md
          cp build/release/release-notes.md "$notes"
          {
            printf '\n## Immutable container images\n\n'
            printf '%s\n' "- \`ghcr.io/${IMAGE_REPOSITORY}-20w@${TOOLING_DIGEST}\` — \`${RELEASE_TAG}\`, \`${RELEASE_COMMIT}\`, \`linux/amd64\`"
            printf '%s\n' "- \`ghcr.io/${IMAGE_REPOSITORY}-fixture-007@${FIXTURE_007_DIGEST}\` — \`${RELEASE_TAG}\`, \`${RELEASE_COMMIT}\`, \`linux/amd64\`, \`NO_RESULT\`"
            printf '%s\n' "- \`ghcr.io/${IMAGE_REPOSITORY}-fixture-019@${FIXTURE_019_DIGEST}\` — \`${RELEASE_TAG}\`, \`${RELEASE_COMMIT}\`, \`linux/amd64\`, \`NO_RESULT\`"
          } >> "$notes"
      - name: Publish or validate the immutable GitHub release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_ID: ${{ steps.release-preflight.outputs.release_id }}
          PREFLIGHT_STATE: ${{ steps.release-preflight.outputs.release_state }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          comparison_root="$(mktemp -d "${RUNNER_TEMP}/20w-release-assets.XXXXXX")"
          cleanup() {
            rm -rf -- "$comparison_root"
          }
          trap cleanup EXIT
          expected_inventory="$comparison_root/expected-assets.txt"
          remote_inventory="$comparison_root/remote-assets.txt"
          tool=build/release-tools/20w
          "$tool" release asset-inventory \
            --assets build/release/assets \
            --phase publication > "$expected_inventory"
          mapfile -t expected_assets < "$expected_inventory"
          assets=()
          declare -A remote_by_name=()
          for name in "${expected_assets[@]}"; do
            asset="build/release/assets/${name}"
            assets+=("$asset")
          done
          verify_tag=(
            "$tool" release verify-tag
            --repository "$GITHUB_REPOSITORY"
            --tag "$RELEASE_TAG"
            --commit "$RELEASE_COMMIT"
          )

          load_release_state() {
            local state_row
            local release_presence
            local release_state_tag
            local trailing
            state_row="$(
              "$tool" release state \
                --repository "$GITHUB_REPOSITORY" \
                --tag "$RELEASE_TAG"
            )"
            if [[ "$state_row" == "absent" ]]; then
              release_found=false
              release_id=""
              release_draft=""
              release_prerelease=""
              release_immutable=""
              return 0
            fi
            IFS=$'\t' read -r release_presence release_id release_draft release_prerelease release_immutable release_state_tag trailing \
              <<< "$state_row"
            if [[ "$release_presence" != "present" || -n "${trailing:-}" \
              || "$release_state_tag" != "$RELEASE_TAG" \
              || ! "$release_id" =~ ^[1-9][0-9]*$ \
              || ! "$release_draft" =~ ^(true|false)$ \
              || ! "$release_prerelease" =~ ^(true|false)$ \
              || ! "$release_immutable" =~ ^(true|false)$ ]]; then
              echo "::error::GitHub Release state is malformed"
              exit 1
            fi
            if [[ "$release_prerelease" != "false" ]]; then
              echo "::error::the release is unexpectedly marked as a prerelease"
              exit 1
            fi
            release_found=true
          }

          compare_asset() {
            local name="$1"
            local downloaded="$2"
            local expected="build/release/assets/${name}"
            local expected_sha
            local downloaded_sha
            expected_sha="$(sha256sum "$expected" | awk '{print $1}')"
            downloaded_sha="$(sha256sum "$downloaded" | awk '{print $1}')"
            if [[ "$expected_sha" != "$downloaded_sha" ]] || ! cmp --silent -- "$expected" "$downloaded"; then
              echo "::error::remote release asset differs from the local asset: ${name}"
              exit 1
            fi
          }

          verify_asset_attestation() {
            local asset="$1"
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$RELEASE_COMMIT" \
              --source-ref "refs/tags/$RELEASE_TAG" >/dev/null
          }

          revalidate_local_assets() {
            local inventory="$comparison_root/local-revalidated.txt"
            "$tool" release asset-inventory \
              --assets build/release/assets \
              --phase publication > "$inventory"
            if ! diff --unified=0 "$expected_inventory" "$inventory"; then
              echo "::error::local release asset authority changed before publication mutation"
              exit 1
            fi
            for asset in "${assets[@]}"; do
              verify_asset_attestation "$asset"
            done
          }

          load_remote_assets() {
            local download_root="$1"
            "$tool" release fetch-assets \
              --repository "$GITHUB_REPOSITORY" \
              --release-id "$release_id" \
              --expected-assets build/release/assets \
              --phase publication \
              --output "$download_root" > "$remote_inventory"
            mapfile -t remote_assets < "$remote_inventory"
            remote_by_name=()
            for name in "${remote_assets[@]}"; do
              remote_by_name["$name"]=1
              compare_asset "$name" "$download_root/$name"
            done
          }

          verify_complete_remote_assets() {
            local download_root="$1"
            local verified_inventory="${download_root}.inventory"
            load_remote_assets "$download_root"
            if ! diff --unified=0 "$expected_inventory" "$remote_inventory"; then
              echo "::error::remote release assets do not match the checksum-derived inventory"
              exit 1
            fi
            "$tool" release asset-inventory \
              --assets "$download_root" \
              --phase publication > "$verified_inventory"
            if ! diff --unified=0 "$expected_inventory" "$verified_inventory"; then
              echo "::error::remote release checksum authority changed during verification"
              exit 1
            fi
            for name in "${expected_assets[@]}"; do
              verify_asset_attestation "$download_root/$name"
            done
          }

          require_draft_state() {
            load_release_state
            if [[ "$release_found" != "true" || "$release_id" != "$PREFLIGHT_ID" \
              || "$release_draft" != "true" || "$release_immutable" != "false" ]]; then
              echo "::error::draft release state changed after the read-only preflight"
              exit 1
            fi
          }

          wait_for_immutable_publication() {
            local expected_id="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              load_release_state
              if [[ "$release_found" == "true" && "$release_id" == "$expected_id" \
                && "$release_draft" == "false" && "$release_immutable" == "true" ]]; then
                return 0
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "::error::published release did not become immutable after five checks"
                exit 1
              fi
              sleep "$((attempt * 2))"
            done
          }

          load_release_state
          case "$PREFLIGHT_STATE" in
            absent)
              if [[ "$release_found" != "false" || -n "$PREFLIGHT_ID" ]]; then
                echo "::error::a release appeared after the read-only preflight"
                exit 1
              fi
              ;;
            draft)
              if [[ "$EVENT_NAME" != "workflow_dispatch" || "$release_found" != "true" \
                || "$release_id" != "$PREFLIGHT_ID" || "$release_draft" != "true" \
                || "$release_immutable" != "false" ]]; then
                echo "::error::draft release state changed after the read-only preflight"
                exit 1
              fi
              ;;
            published)
              if [[ "$EVENT_NAME" != "workflow_dispatch" || "$release_found" != "true" \
                || "$release_id" != "$PREFLIGHT_ID" || "$release_draft" != "false" \
                || "$release_immutable" != "true" ]]; then
                echo "::error::immutable release state changed after the read-only preflight"
                exit 1
              fi
              "${verify_tag[@]}"
              verify_complete_remote_assets "$comparison_root/published-recheck"
              load_release_state
              if [[ "$release_found" != "true" || "$release_id" != "$PREFLIGHT_ID" \
                || "$release_draft" != "false" || "$release_immutable" != "true" ]]; then
                echo "::error::immutable release changed during final validation"
                exit 1
              fi
              exit 0
              ;;
            *)
              echo "::error::read-only preflight did not provide a valid release state"
              exit 1
              ;;
          esac

          if [[ "$PREFLIGHT_STATE" == "draft" ]]; then
            load_remote_assets "$comparison_root/draft-existing"
            missing_assets=()
            for name in "${expected_assets[@]}"; do
              if [[ -z "${remote_by_name[$name]+present}" ]]; then
                missing_assets+=("build/release/assets/${name}")
              fi
            done
            if (( ${#missing_assets[@]} > 0 )); then
              revalidate_local_assets
              gh release upload "$RELEASE_TAG" "${missing_assets[@]}"
            fi
            verify_complete_remote_assets "$comparison_root/draft-complete"
            require_draft_state
            "${verify_tag[@]}"
            revalidate_local_assets
            gh release edit "$RELEASE_TAG" \
              --verify-tag \
              --title "20 Watts Was Enough ${RELEASE_TAG}" \
              --notes-file build/release/published-release-notes.md \
              --draft=false
            published_id="$release_id"
          else
            load_release_state
            if [[ "$release_found" != "false" ]]; then
              echo "::error::a release appeared immediately before draft creation"
              exit 1
            fi
            "${verify_tag[@]}"
            revalidate_local_assets
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "20 Watts Was Enough ${RELEASE_TAG}" \
              --notes-file build/release/published-release-notes.md
            load_release_state
            if [[ "$release_found" != "true" || "$release_draft" != "true" \
              || "$release_immutable" != "false" ]]; then
              echo "::error::new release was not created as a mutable draft"
              exit 1
            fi
            published_id="$release_id"
            verify_complete_remote_assets "$comparison_root/new-draft-complete"
            load_release_state
            if [[ "$release_found" != "true" || "$release_id" != "$published_id" \
              || "$release_draft" != "true" || "$release_immutable" != "false" ]]; then
              echo "::error::new draft changed before publication"
              exit 1
            fi
            "${verify_tag[@]}"
            revalidate_local_assets
            gh release edit "$RELEASE_TAG" --verify-tag --draft=false
          fi

          wait_for_immutable_publication "$published_id"
          "${verify_tag[@]}"
          verify_complete_remote_assets "$comparison_root/published-final"
