name: Research release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N tag to rebuild
        required: true
        type: string

permissions: {}

concurrency:
  group: research-release-publication
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
