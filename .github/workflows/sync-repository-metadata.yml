name: Synchronize repository metadata

on:
  issues:
    types: [closed, reopened]
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/milestones.json
      - .github/issue-milestones.json
      - .github/workflows/sync-repository-metadata.yml
      - tooling/cmd/20w/github_issue_lifecycle.go
      - tooling/cmd/20w/github_metadata.go
      - tooling/cmd/20w/github_pr_metadata.go
      - tooling/cmd/20w/main.go
      - tooling/internal/githublabels/**
      - tooling/internal/githubapi/**
      - tooling/internal/githubissuemilestones/**
      - tooling/internal/githubissuelifecycle/**
      - tooling/internal/githubmilestones/**
      - tooling/internal/githubprmetadata/**
      - tooling/internal/repositorymanifest/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-metadata-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    name: Apply canonical labels, milestones, and issue assignments
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Use Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.sum
      - name: Create or repair managed metadata
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: go -C tooling run ./cmd/20w github sync-metadata --root .. --repository "$GITHUB_REPOSITORY"
      - name: Reconcile the managed issue lifecycle
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          go -C tooling run ./cmd/20w github sync-issue-lifecycle
          --root .. --repository "$GITHUB_REPOSITORY"
          --issue "$ISSUE_NUMBER" --issue-action "$ISSUE_ACTION"
