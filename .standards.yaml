version: 1
repository:
    owner: cordanaLLM
    name: 20-watts-was-enough
    visibility: public
    # Copied from the forge on 2026-10-11, so the committed manifest names
    # the values a sync compares; the homepage is declared as https.
    description: A biologically inspired R&D blueprint for sparse, grounded, continual, energy-efficient AI.
    homepage: https://www.cordana.dev/
    topics:
        - active-sensing
        - adaptive-computation
        - artificial-intelligence
        - biologically-inspired-ai
        - biomimetics
        - causal-inference
        - conditional-computation
        - continual-learning
        - embodied-ai
        - energy-efficient-ai
        - eu-ai-act
        - memory-consolidation
        - model-compression
        - modular-neural-networks
        - neuroscience
        - open-science
        - predictive-processing
        - sensorimotor-learning
        - sparse-computation
        - world-models
profiles:
    - planning-artifacts
facets:
    - security:high
    - api:public-contract
    - docs:seo-portal
    - agent:sandboxed
agent_clients: [claude, codex, gemini]
editors: [universal, vscode, antigravity]
register:
    sources:
        expected: 13
        sha256:
            sha256:21731aeac3c2442a4eb28abd0593ab59cb453db34c8937c0b268c70d219141aa
        inputs:
            - path: .paperclip/harness.json
              surface: prompts
              kind: message
              format: json
              selector: operating_contract.*
            - path: .paperclip/harness.json
              surface: prompts
              kind: message
              format: json
              selector: invariants.*
documentation:
    # research/claims.md is 1.6 MiB; the default per-file bound is 1 MiB.
    max_file_bytes: 2097152
    # Decision 0095: 35 files, each named. The first six stay excluded: imported
    # sources and accepted decision records keep their bytes. The other 29 held
    # 586 style findings on 2026-10-11 and leave this list as their fixes land.
    style_exclude:
        - sources/2026-08-05-gemini-energy-comparison.md
        - sources/2026-08-05-gemini-training-pipeline.md
        - sources/2026-08-05-google-doc.md
        - decisions/0062-impact-scope-comparable-main-pushes.md
        - decisions/0090-re-record-book-provenance-for-dependency-records.md
        - decisions/0091-derive-plain-version-copies-and-keep-reviewed-literals.md
        - concept/25-active-chemical-sensing.md
        - experiments/candidates/002-multiscale-context-broadcast.md
        - experiments/candidates/009-graded-assurance-envelopes.md
        - experiments/candidates/011-dual-loop-operational-assurance.md
        - experiments/candidates/012-latency-qualified-authority.md
        - experiments/candidates/015-versioned-repairable-conventions.md
        - experiments/fixtures/018-environmental-process-state-control.md
        - experiments/fixtures/019-finance-risk-attention-governance.md
        - experiments/fixtures/020-integrative-comparative-physiology.md
        - experiments/fixtures/021-tribology-contact-adaptive-interfaces.md
        - experiments/fixtures/027-interface-qualified-retroactivity-insulation.md
        - math/boundary-qualified-physical-computation.md
        - research/audits/2026-08-05-animal-navigation-sensory-ecology.md
        - research/audits/2026-08-05-built-environment-urban-systems.md
        - research/audits/2026-08-05-hci-human-factors.md
        - research/audits/2026-08-05-mechanical-civil-resilience.md
        - research/audits/2026-08-05-pathology-rehabilitation.md
        - research/audits/2026-08-05-security-cryptography.md
        - research/audits/2026-08-05-semiconductor-device-reliability.md
        - research/audits/2026-08-21-accounting-audit-actuarial-insurance.md
        - research/audits/2026-08-21-direct-social-research-ethnography-media.md
        - research/audits/2026-08-21-mineralogy-petrology-geochemistry.md
