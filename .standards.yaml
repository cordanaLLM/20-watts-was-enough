        - research/audits/2026-08-24-finance-management-risk-attention-governance.md
        - research/audits/2026-08-27-rsd-t02-population-identifiability-calibration.md
        - research/claims.md
        - research/domain-inventory.md
        - research/field-coverage.md
adoption:
    # Decision 0095: LICENSES/ holds third-party licence texts only; this
    # repository has no REUSE annotations yet (cordanaLLM/praetor#1244).
    decline: [reuse-gate]
overrides:
    branch_protection:
        # Declared 2026-10-11: one maintainer account, no review bot with
        # approval rights. Restore `independent` when a second reviewer exists.
        review_mode: single_maintainer

# Dated exceptions (one rule, one path, one reason, one end date each). An
# expired entry fails like a missing one. Decision 0095, point 9.
exceptions:
  - rule: "HISS-11"
    path: ".github/workflows/release.yml"
    reason: "release.yml attests build provenance in the build job (SLSA 2), has no cosign signing step, and its BuildKit SBOM generator is not counted as an SBOM step; raising it is a release unit of its own"
    expires: "2027-01-09"
