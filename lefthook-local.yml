# This repository's own hook jobs. Lefthook merges this file over lefthook.yml,
# which the Praetor engine generates and which stays byte-exact so the engine
# can verify it. The Go module lives in tooling/, so the Go jobs run there.
pre-commit:
  commands:
    # Exception, one job: reuse-lint is skipped until 2026-11-30. The engine
    # reads LICENSES/ as a REUSE declaration; this repository keeps third-party
    # licence texts there and has no REUSE annotations yet, so the job fails on
    # every commit. Declining the reuse-gate step drops only the workflow
    # (cordanaLLM/praetor#1244). scripts/validate-engineering-policy.mjs refuses
    # this skip from 2026-12-01 on. Decision 0095.
    reuse-lint:
      skip: true
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    govet:
      glob: "*.go"
      run: go -C tooling vet ./...

pre-push:
  commands:
    # govulncheck is pinned in tooling/tools/go.mod; the command fails when
    # the scanner misses a planted advisory, so an absent tool cannot pass.
    security:
      run: go -C tooling run ./cmd/20w security govulncheck --root ..
    # Exception, one job: the generated gate job is skipped until 2027-03-12. Its
    # npm stages take node from PATH and the engine selects no version, so a host
    # node that drifts from .node-version fails pretest on every push.
    # pinned-node-gate replays the same engine line on node from .node-version
    # through mise, under the engine's admit scope. scripts/validate-engineering-policy.mjs
    # pins both lines and refuses this skip from 2027-03-13 on. Decision 0129.
    gate:
      skip: true
    pinned-node-gate:
      run: go -C tooling run ./cmd/20w hooks pre-push-gate --root ..
